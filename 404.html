<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <title>Halaman tidak ditemukan | MeruVerse</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --snow: #ffffff;
        --jet: #0a0a0a;
        --charcoal: #2a2a2a;
        --flame: #ee3e12;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--snow);
        color: var(--jet);
        font-family: "Geist Variable", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(44rem, 100%);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.9375rem;
        font-weight: 700;
        letter-spacing: 0.28em;
      }
      h1 {
        margin: 3rem 0 0;
        font-size: clamp(3rem, 12vw, 7.5rem);
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: -0.05em;
      }
      p {
        margin: 1.5rem 0 0;
        max-width: 28rem;
        font-size: 1.125rem;
        line-height: 1.5;
        color: var(--charcoal);
      }
      a.button {
        display: inline-flex;
        align-items: center;
        margin-top: 2.5rem;
        height: 3.5rem;
        padding: 0 1.75rem;
        border-radius: 9999px;
        background: var(--jet);
        color: var(--snow);
        font-weight: 600;
        text-decoration: none;
      }
      a.button:hover,
      a.button:focus-visible {
        background: var(--flame);
        color: var(--jet);
      }
      a.button:focus-visible {
        outline: 2px solid var(--jet);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14.5" fill="none" stroke="#0a0a0a" stroke-width="1.5" />
          <path d="M7.5 21.5 14 10.5l4 6.5 2.5-3.5 4 8z" fill="#ee3e12" />
        </svg>
        <span>MERUVERSE</span>
      </div>
      <h1>Halaman tidak ditemukan.</h1>
      <p>Alamat yang Anda buka tidak ada. Mungkin tautannya sudah berubah atau salah ketik.</p>
      <a class="button" href="%BASE_URL%">Kembali ke beranda</a>
    </main>
  </body>
</html>
